# ~/.config/picom.conf
# Subtle only: soft shadows so floating windows read as floating, a
# touch of rounded corners. No blur, no fading — those read as "rice
# screenshot" more than "someone's actual desktop".
#
# backend: "xrender" over "glx" on purpose — this rice targets real,
# unknown hardware (no known GPU/driver ahead of time), and xrender
# works everywhere X does without needing working OpenGL. The effects
# here are light enough that xrender's extra CPU cost doesn't matter.
# If you know the box has a solid Mesa/GL stack, "glx" is a bit smoother.

backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-exclude = [
  "class_g = 'xfce4-panel'",
  "class_g = 'Xfdesktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

corner-radius = 6;
rounded-corners-exclude = [
  "class_g = 'xfce4-panel'",
  "class_g = 'Xfdesktop'"
];

fading = false;
inactive-opacity = 1;
